name: Privacy and setup checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python3 scripts/privacy_check.py
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: python3 scripts/hermes.py --root "${RUNNER_TEMP}/hermes-runtime" init
      - run: python3 scripts/hermes.py --root "${RUNNER_TEMP}/hermes-runtime" doctor
      - run: python3 scripts/hermes.py --root "${RUNNER_TEMP}/hermes-demo" start --demo --setup-only
      - run: python3 scripts/build_preview.py --version ci-check
      - run: node --check site/app.js
      - run: node --check hermes_lite/static/app.js
