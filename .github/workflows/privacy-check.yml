name: Privacy and setup checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 scripts/privacy_check.py
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: python3 scripts/hermes.py --root "${RUNNER_TEMP}/hermes-runtime" init
      - run: python3 scripts/hermes.py --root "${RUNNER_TEMP}/hermes-runtime" doctor
