# Dedicated static-only loopback origin. Do not proxy owner services here.
server {
    listen 127.0.0.1:9082;
    server_name _;
    root /var/www/hermes-preview/current;
    index index.html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; media-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control "no-cache" always;
    location / { limit_except GET HEAD { deny all; } try_files $uri $uri/ =404; }
    location /api/ { return 404; }
    location ~ /\. { deny all; }
}
